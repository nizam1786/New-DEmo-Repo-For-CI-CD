name: Deploy to Integration Org

on:
  push:
    branches:
      - main
    paths:
      - "force-app/**"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install Salesforce CLI
        run: |
          wget https://developer.salesforce.com/media/salesforce-cli/sf/channels/stable/sf-linux-x64.tar.xz
          mkdir -p ~/sf
          tar xJf sf-linux-x64.tar.xz -C ~/sf --strip-components 1
          echo "$HOME/sf/bin" >> $GITHUB_PATH

      - name: Authenticate
        run: |
          echo ${{ secrets.SFDX_INTEGRATION_URL }} > auth.txt
          sf org login sfdx-url -f auth.txt -a integration

      - name: Install sfdx-git-delta
        run: echo y | sf plugins:install sfdx-git-delta

      - name: Create delta
        run: |
          sf sgd:source:delta \
            --from "HEAD~1" \
            --to "HEAD" \
            --output changed-sources \
            --generate-delta \
            --source force-app/

      - name: Deploy
        run: |
          if [ -f changed-sources/package/package.xml ]; then
            sf project deploy start \
              -x changed-sources/package/package.xml \
              -l NoTestRun \
              --json
          else
            echo "Nothing to deploy"
          fi
